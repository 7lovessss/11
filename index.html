<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FFF3E2'/%3E%3Crect x='16' y='36' width='32' height='16' rx='4' fill='%23FFB7CE'/%3E%3Crect x='24' y='24' width='16' height='13' rx='3' fill='%23A9E3D0'/%3E%3Crect x='31' y='14' width='2.5' height='9' rx='1' fill='%23FF8FB0'/%3E%3Cellipse cx='32.2' cy='12' rx='3' ry='4.5' fill='%23FFD86B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="preconnect" href="https://sf3-scmcdn-cn.feishucdn.com" crossorigin>
<link rel="preload" href="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/lark-miaoda-fonts/fonts/baloo-2/f5fe334e558d.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Baloo+2:wght@800&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
/* 手机上点按不要出现灰框 / 焦点框 */
*,*::before,*::after{-webkit-tap-highlight-color:transparent}
button,a,img{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
button{-webkit-appearance:none;appearance:none}
button:focus{outline:none}
button:focus-visible{outline:2px solid rgba(214,170,140,.4);outline-offset:3px}
img{-webkit-user-drag:none}
:root{
  --cream:#FFF7EC; --ink:#4A3B32;
  --m1:#FF9EC4; --m2:#8ED9C4; --m3:#FFD86B; --m4:#9FC6F5; --m5:#C7AEF0; --m6:#FFB59E;
}
html,body{height:100%}
body{background:var(--cream);color:var(--ink);
  font-family:"Baloo 2","PingFang SC","Noto Sans SC",sans-serif;overflow:hidden}
.bg{position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(70% 50% at 50% 6%,#FFFDF6 0%,rgba(255,253,246,0) 62%),
    radial-gradient(60% 45% at 8% 88%,rgba(255,222,236,.55),rgba(255,222,236,0) 70%),
    radial-gradient(55% 40% at 96% 78%,rgba(224,246,238,.6),rgba(224,246,238,0) 70%),
    linear-gradient(180deg,#FFFAF1,#FFF1DF);}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.4;mix-blend-mode:multiply;
  background-image:radial-gradient(rgba(196,160,120,.16) .7px,transparent .7px);background-size:4px 4px}

.scene{position:fixed;inset:0;display:grid;place-items:center;
  opacity:0;pointer-events:none;transform:scale(.985);
  transition:opacity .55s ease,transform .55s cubic-bezier(.2,1,.3,1);z-index:2}
.scene.on{opacity:1;pointer-events:auto;transform:none;z-index:3}

/* ---------- 封面 ---------- */
.arc{position:absolute;inset:0;pointer-events:none;z-index:4}
.arc span{position:absolute;left:0;top:0;font-size:var(--fs);font-weight:800;line-height:1;
  animation:pop .72s cubic-bezier(.22,1.35,.4,1) both}
@keyframes pop{0%{opacity:0;scale:.4}55%{opacity:1;scale:1.12}100%{opacity:1;scale:1}}
.cake-wrap{position:relative;z-index:5;display:flex;flex-direction:column;align-items:center;gap:14px;
  opacity:0;animation:rise .9s cubic-bezier(.2,1.2,.35,1) .95s forwards}
@keyframes rise{0%{opacity:0;transform:translateY(36px) scale(.86)}
  70%{opacity:1;transform:translateY(-6px) scale(1.03)}100%{opacity:1;transform:none}}
.cake{width:clamp(196px,56vw,286px);padding:0;border:0;background:none;cursor:pointer;display:block;
  filter:drop-shadow(0 16px 26px rgba(214,150,168,.28));
  transition:transform .35s cubic-bezier(.2,1.3,.4,1);animation:float 4.6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.cake:hover{transform:translateY(-6px) scale(1.035)}
.cake:active{transform:translateY(2px) scale(.97)}
.cake svg{display:block;width:100%;height:auto}
.hint{font-size:14px;letter-spacing:.16em;color:#B08E86;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{opacity:.66;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
.dot{position:absolute;border-radius:50%;pointer-events:none;animation:tw 3.6s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.85)}50%{opacity:.9;transform:scale(1.15)}}

/* ---------- 第二页：切蛋糕 ---------- */
.head{position:absolute;top:0;left:0;right:0;padding:34px 26px 0;text-align:center;z-index:6;pointer-events:none}
.head h2{font-size:20px;letter-spacing:.24em;color:#8C776C;font-weight:800}
.head p{margin-top:8px;font-size:13px;letter-spacing:.06em;color:#AF988F}
.back{position:absolute;left:20px;top:26px;z-index:8;font-family:inherit;font-size:13px;color:#9C877C;
  background:rgba(255,253,247,.7);border:1px solid #F0DFC8;border-radius:999px;padding:8px 14px;cursor:pointer}
.back:hover{background:#FFF3E0}

.cut{position:relative;z-index:5;display:flex;flex-direction:column;align-items:center;gap:18px;
  margin-top:18px}
.dish{position:relative;width:min(84vw,380px)}
.dish svg{display:block;width:100%;height:auto;filter:drop-shadow(0 18px 26px rgba(206,158,150,.24))}
.slice{cursor:pointer;transition:transform .45s cubic-bezier(.2,1.25,.35,1),filter .35s ease}
.slice:hover{filter:brightness(1.06) saturate(1.05)}
.slice.dim{opacity:.45}
.wnum{font-size:12px;letter-spacing:.16em;fill:#7A6157}

.fork{width:clamp(62px,16vw,86px);padding:0;border:0;background:none;cursor:pointer;
  transition:transform .35s cubic-bezier(.2,1.3,.4,1);animation:float 4.2s ease-in-out infinite}
.fork:hover{transform:translateY(-7px) rotate(-6deg)}
.fork:active{transform:translateY(0) scale(.97)}
.fork svg{display:block;width:100%;height:auto}
.next-hint{font-size:13px;letter-spacing:.18em;color:#B08E86;animation:bob 2.4s ease-in-out infinite}

/* ---------- 图片弹层 ---------- */
.pic{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:24px;
  background:rgba(255,247,236,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;pointer-events:none;transition:opacity .4s ease}
.pic.on{opacity:1;pointer-events:auto}
.pic-card{width:min(330px,88vw);background:#FFFDF7;border:1px solid #F0DFC8;border-radius:18px;padding:14px;
  box-shadow:0 24px 54px rgba(190,150,130,.2);transform:translateY(16px) scale(.95);
  transition:transform .45s cubic-bezier(.2,1.2,.35,1)}
.pic.on .pic-card{transform:none}
.frame{position:relative;width:100%;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#FFF6E9}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;border:2px dashed #F0D9C0;border-radius:12px;color:#B08E86;text-align:center;padding:18px}
.ph b{font-size:15px;letter-spacing:.06em;color:#8C776C}
.ph small{font-size:11.5px;line-height:1.7;letter-spacing:.02em}
.ph .pick{margin-top:10px;font-family:inherit;font-size:12.5px;color:#8C6A5E;background:#FFF1DC;
  border:1px solid #F0DFC8;border-radius:999px;padding:8px 16px;cursor:pointer;display:none}
.ph .pick.on{display:inline-block}
.pic-cap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 6px 4px}
.pic-cap span{font-size:13px;letter-spacing:.1em;color:#9C877C}
.pic-cap button{font-family:inherit;font-size:13px;color:#7A6157;background:#FFF1DC;border:1px solid #F0DFC8;
  border-radius:999px;padding:9px 18px;cursor:pointer}
.pic-cap button:hover{background:#FFE8CB}

/* ---------- 第三页占位 ---------- */
.end-card{text-align:center;padding:30px}
.end-card h2{font-size:26px;letter-spacing:.06em}
.end-card p{margin-top:14px;font-size:13.5px;line-height:2;color:#8C776C;letter-spacing:.02em}
.end-card .pill{margin-top:22px;display:inline-block;font-family:inherit;font-size:13.5px;color:#7A6157;
  background:#FFF1DC;border:1px solid #F0DFC8;border-radius:999px;padding:11px 22px;cursor:pointer}

/* ---------- 第三页：信 + 小熊 + 烟花 ---------- */
.letter-wrap{display:flex;flex-direction:column;align-items:center;gap:34px;margin-top:16px}
.letter-row{display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,26px)}
.env,.bear{padding:0;border:0;background:none;cursor:pointer;display:block}
.env{width:clamp(186px,50vw,272px);transition:transform .4s cubic-bezier(.2,1.2,.35,1)}
.env:hover{transform:translateY(-7px) rotate(-2deg)}
.env svg,.bear svg{display:block;width:100%;height:auto}
.env{filter:drop-shadow(0 16px 22px rgba(206,160,150,.22))}
.bear{width:clamp(104px,27vw,148px);filter:drop-shadow(0 12px 18px rgba(206,160,150,.22));
  animation:bearFloat 3.4s ease-in-out infinite}
@keyframes bearFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(-2deg)}}
.bear.singing{animation:bearDance .58s ease-in-out infinite}
@keyframes bearDance{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(5deg)}}
.bear-box{position:relative;display:flex;align-items:flex-end}
.lyric{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translate(-50%,6px);
  background:#FFFDF6;border:1px solid #F0DFC8;border-radius:12px;padding:8px 14px;
  font-size:14px;letter-spacing:.1em;color:#8C6A5E;white-space:nowrap;
  box-shadow:0 10px 22px rgba(200,160,140,.16);opacity:0;
  transition:opacity .25s ease,transform .25s ease;pointer-events:none}
.lyric::after{content:"";position:absolute;left:50%;top:100%;width:8px;height:8px;margin-left:-4px;
  background:#FFFDF6;border-right:1px solid #F0DFC8;border-bottom:1px solid #F0DFC8;
  transform:rotate(45deg);margin-top:-4px}
.lyric.on{opacity:1;transform:translate(-50%,0)}
.music-hint{font-size:12.5px;letter-spacing:.14em;color:#B08E86;margin-top:-14px}

.fw-row{display:flex;gap:clamp(18px,7vw,54px);align-items:flex-end;cursor:pointer;padding:6px 10px}
.fw{position:relative;width:clamp(88px,23vw,120px);height:clamp(88px,23vw,120px);opacity:.95}
.fw b{position:absolute;left:50%;bottom:50%;width:3px;height:58%;border-radius:3px;
  background:linear-gradient(to top,currentColor,rgba(255,255,255,0));
  transform-origin:50% 100%;animation:burst 2.1s ease-out infinite}
@keyframes burst{
  0%{transform:rotate(var(--r)) scaleY(.45);opacity:.2}
  25%{opacity:1}
  70%{transform:rotate(var(--r)) scaleY(1);opacity:.9}
  100%{transform:rotate(var(--r)) scaleY(1.25);opacity:0}
}
.fw b:nth-child(3n){animation-delay:.18s}
.fw b:nth-child(3n+1){animation-delay:.36s}
.fw b:nth-child(4n){animation-delay:.52s}
.fw::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;
  border-radius:50%;background:currentColor;box-shadow:0 0 18px currentColor;animation:tw 2.1s ease-in-out infinite}
.fw-hint{font-size:13px;letter-spacing:.18em;color:#B08E86;animation:bob 2.4s ease-in-out infinite}

/* 信纸 */
.letter-modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:22px;
  background:rgba(255,247,236,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;pointer-events:none;transition:opacity .4s ease}
.letter-modal.on{opacity:1;pointer-events:auto}
.paper{display:flex;flex-direction:column;width:min(340px,88vw);max-height:78vh;background:#FFFDF6;border:1px solid #EFDCBF;
  border-radius:10px;padding:30px 26px 22px;box-shadow:0 26px 56px rgba(190,150,130,.22);
  transform:translateY(18px) scale(.95);transition:transform .5s cubic-bezier(.2,1.2,.35,1);
  background-image:radial-gradient(120% 80% at 50% 0%,#FFFDF8,rgba(255,253,248,0)),linear-gradient(180deg,#FFFEF9,#FFFAF0)}
.letter-modal.on .paper{transform:none}
.paper .to{font-size:14px;letter-spacing:.12em;color:#A98E80}
.paper p{font-size:15px;line-height:2.1;color:#5C4A40;margin-top:10px;white-space:pre-wrap}
.paper .sign{margin-top:22px;text-align:right;font-size:14px;color:#8C776C}
.paper-scroll{overflow:auto;min-height:0;-webkit-overflow-scrolling:touch}
.paper .close{display:block;flex:0 0 auto;margin:18px auto 0;font-family:inherit;font-size:13px;color:#7A6157;
  background:#FFF1DC;border:1px solid #F0DFC8;border-radius:999px;padding:9px 20px;cursor:pointer}

/* ---------- 第四页：星空 + 烟花 ---------- */
#s4{background:
  radial-gradient(80% 55% at 50% 12%,#2B2A55 0%,rgba(43,42,85,0) 62%),
  radial-gradient(70% 45% at 12% 30%,rgba(96,64,138,.55),rgba(96,64,138,0) 70%),
  radial-gradient(70% 45% at 88% 26%,rgba(40,78,124,.5),rgba(40,78,124,0) 70%),
  linear-gradient(180deg,#0E1030 0%,#171634 42%,#2A2140 74%,#3A2A46 100%)}
#skyCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.castle{position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:min(560px,94vw);pointer-events:none;opacity:.96}
.back.dk{color:#C9C4DE;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22)}
.back.dk:hover{background:rgba(255,255,255,.16)}
.bless{position:absolute;left:0;right:0;top:46%;text-align:center;padding:0 26px;
  opacity:0;transform:translateY(14px);transition:opacity 1.1s ease,transform 1.1s ease}
.bless.on{opacity:1;transform:none}
.bless .k{font-size:15px;letter-spacing:.42em;color:rgba(255,246,227,.66);margin-bottom:14px}
.bless .t{font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif;
  font-size:clamp(22px,5.6vw,34px);line-height:1.9;letter-spacing:.12em;color:#FFF6E3;
  text-shadow:0 0 24px rgba(255,214,150,.35),0 2px 10px rgba(0,0,0,.35)}

@media (max-width:380px){.head{padding-top:26px}.head h2{font-size:17px}}
</style>
</head>
<body>
<div class="bg"></div><div class="grain"></div>

<!-- ================= 第一页：封面 ================= -->
<div class="scene on" id="s1">
  <div class="arc" id="arc"></div>
  <div class="cake-wrap">
    <button class="cake" id="cake" aria-label="点击蛋糕进入">
      <svg viewBox="0 0 300 340" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="150" cy="309" rx="118" ry="15" fill="#FFD8E3" opacity=".55"/>
        <ellipse cx="150" cy="305" rx="104" ry="11" fill="#FFF6EC"/>
        <path d="M34 226h232v56c0 12-9 20-20 20H54c-11 0-20-8-20-20z" fill="#FFF3E1"/>
        <path d="M34 226h232v10c0 0-6 12-13 12s-9-12-16-12-7 14-14 14-8-14-15-14-8 13-15 13-7-13-14-13-8 12-15 12z" fill="#FFB7CE"/>
        <path d="M174 226h92v8c0 0-5 11-12 11s-8-11-14-11-6 12-13 12-8-12-15-12z" fill="#FFD0DE" opacity=".9"/>
        <circle cx="122" cy="272" r="5.2" fill="#5B4A42"/><circle cx="178" cy="272" r="5.2" fill="#5B4A42"/>
        <circle cx="120.4" cy="270.4" r="1.6" fill="#fff"/><circle cx="176.4" cy="270.4" r="1.6" fill="#fff"/>
        <ellipse cx="124" cy="285" rx="6" ry="4" fill="#FF9EC4" opacity=".55"/>
        <ellipse cx="176" cy="285" rx="6" ry="4" fill="#FF9EC4" opacity=".55"/>
        <path d="M143 278q7 8 14 0" stroke="#5B4A42" stroke-width="3" fill="none" stroke-linecap="round"/>
        <rect x="66" y="252" width="12" height="4" rx="2" fill="#8ED9C4" transform="rotate(-18 66 252)"/>
        <rect x="222" y="250" width="12" height="4" rx="2" fill="#9FC6F5" transform="rotate(20 222 250)"/>
        <rect x="86" y="292" width="11" height="4" rx="2" fill="#C7AEF0" transform="rotate(12 86 292)"/>
        <rect x="204" y="294" width="11" height="4" rx="2" fill="#FFD86B" transform="rotate(-14 204 294)"/>
        <path d="M74 152h152v56c0 10-8 17-18 17H92c-10 0-18-7-18-17z" fill="#FFDDEA"/>
        <path d="M74 152h152v9c0 0-6 12-13 12s-9-12-16-12-7 13-14 13-8-13-15-13-8 12-15 12z" fill="#FFF6EA"/>
        <path d="M204 152h22v7c0 0-5 10-11 10s-7-10-11-10z" fill="#FFFBF4" opacity=".95"/>
        <circle cx="106" cy="196" r="4" fill="#FF9EC4" opacity=".8"/>
        <circle cx="150" cy="204" r="4" fill="#8ED9C4" opacity=".85"/>
        <circle cx="192" cy="196" r="4" fill="#FFD86B" opacity=".85"/>
        <circle cx="112" cy="138" r="9" fill="#FF6E8E"/><circle cx="109.5" cy="135" r="3" fill="#fff" opacity=".55"/>
        <path d="M114 130q4-9 12-10" stroke="#8E6E5A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <rect x="134" y="96" width="11" height="52" rx="5" fill="#FFF6EA"/>
        <rect x="134" y="104" width="11" height="6" fill="#FF9EC4"/>
        <rect x="134" y="120" width="11" height="6" fill="#8ED9C4"/>
        <rect x="134" y="136" width="11" height="6" fill="#FFD86B"/>
        <ellipse cx="139.5" cy="86" rx="6.5" ry="10" fill="#FFC24D"/>
        <ellipse cx="139.5" cy="88" rx="3.6" ry="6" fill="#FFF1B0"/>
        <rect x="158" y="108" width="9" height="40" rx="4.5" fill="#FFF6EA"/>
        <rect x="158" y="116" width="9" height="5" fill="#C7AEF0"/>
        <rect x="158" y="130" width="9" height="5" fill="#FFB59E"/>
        <ellipse cx="162.5" cy="100" rx="5.4" ry="8.4" fill="#FFC24D"/>
        <ellipse cx="162.5" cy="101.5" rx="3" ry="5" fill="#FFF1B0"/>
      </svg>
    </button>
    <div class="hint">点一下蛋糕，进门</div>
  </div>
</div>

<!-- ================= 第二页：切蛋糕 ================= -->
<div class="scene" id="s2">
  <button class="back" onclick="go('s1')">← 封面</button>
  <div class="head">
    <h2>五份蛋糕 · 五个秘密</h2>
    <p>切开哪一块，就先看见哪一段</p>
  </div>

  <div class="cut">
    <div class="dish">
      <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" id="dishSvg">
        <!-- 盘子 -->
        <circle cx="200" cy="200" r="192" fill="#FFFDF7"/>
        <circle cx="200" cy="200" r="192" fill="none" stroke="#F5E3CB" stroke-width="2"/>
        <circle cx="200" cy="200" r="182" fill="none" stroke="#FBEEDC" stroke-width="6"/>
        <g id="slices"></g>
        <circle cx="200" cy="200" r="16" fill="#FFF8EE"/>
        <circle cx="200" cy="200" r="8" fill="#FFDDEA"/>
      </svg>
    </div>

    <button class="fork" id="fork" aria-label="去下一站">
      <svg viewBox="0 0 120 220" xmlns="http://www.w3.org/2000/svg">
        <g transform="rotate(8 60 110)">
          <rect x="52" y="60" width="16" height="120" rx="8" fill="#C9C4CE"/>
          <rect x="54" y="62" width="5" height="116" rx="2.5" fill="#EDEAF2" opacity=".9"/>
          <circle cx="60" cy="178" r="12" fill="#C9C4CE"/>
          <circle cx="60" cy="178" r="6" fill="#EDEAF2" opacity=".8"/>
          <rect x="44" y="26" width="4.5" height="42" rx="2.2" fill="#C9C4CE"/>
          <rect x="52" y="20" width="4.5" height="48" rx="2.2" fill="#C9C4CE"/>
          <rect x="60" y="20" width="4.5" height="48" rx="2.2" fill="#C9C4CE"/>
          <rect x="68" y="26" width="4.5" height="42" rx="2.2" fill="#C9C4CE"/>
          <path d="M44 60h28c0 12-6 18-14 18s-14-6-14-18z" fill="#D6D1DA"/>
        </g>
      </svg>
    </button>
    <div class="next-hint">吃完这块，用叉子往下走</div>
  </div>
</div>

<!-- ================= 第三页：一封信 + 小熊 + 烟花 ================= -->
<div class="scene" id="s3">
  <button class="back" onclick="go('s2')">← 蛋糕</button>
  <div class="head"><h2>还有一封信</h2><p>信封上没写名字，但你一眼就知道是给你的</p></div>

  <div class="letter-wrap">
    <div class="letter-row">
      <button class="env" id="env" aria-label="打开信封">
        <svg viewBox="0 0 300 210" xmlns="http://www.w3.org/2000/svg">
          <rect x="18" y="34" width="264" height="160" rx="10" fill="#FFF6E8" stroke="#F0DCC0" stroke-width="2"/>

/* ---------------- 封面弧形文字 ---------------- */
(function(){
  var arc = document.getElementById('arc');
  var txt = "HAPPY BIRTHDAY!";
  var palette = ['--m1','--m2','--m3','--m4','--m5','--m6'].map(function(v){
    return getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  });
  var letters = [], i;
  for(i=0;i<txt.length;i++){ if(txt[i] !== ' ') letters.push(txt[i]); }

  var slots = [], w = 0;
  for(i=0;i<txt.length;i++){
    if(txt[i] === ' '){ w += 0.62; continue; }
    slots.push(w); w += 1;
  }
  var total = w - 1;

  var els = letters.map(function(ch, idx){
    var s = document.createElement('span');
    s.textContent = ch;
    s.style.animationDelay = (0.16 + idx * 0.075) + 's';
    s.style.color = palette[idx % palette.length];
    s.style.textShadow = '0 4px 0 rgba(255,255,255,.85), 0 10px 20px rgba(190,150,140,.28)';
    arc.appendChild(s);
    return s;
  });

  function layout(){
    var W = window.innerWidth, H = window.innerHeight;
    var cx = W / 2;
    var cy = H / 2 - 14;
    var r  = Math.min(W * 0.40, H * 0.30);
    var fs = Math.max(18, Math.min(W * 0.072, 52));
    r = Math.max(r, fs * 3.2);
    var span = 178;
    for(var k=0; k<els.length; k++){
      var t = slots[k] / total;
      var a = (-span / 2 + span * t) * Math.PI / 180;
      var el = els[k];
      el.style.setProperty('--fs', fs + 'px');
      el.style.left = (cx + r * Math.sin(a)) + 'px';
      el.style.top  = (cy - r * Math.cos(a)) + 'px';
      el.style.transform = 'translate(-50%,-50%) rotate(' + (a * 180 / Math.PI).toFixed(2) + 'deg)';
    }
  }
  layout();
  window.addEventListener('resize', layout);

  for(var d=0; d<11; d++){
    var dot = document.createElement('div');
    dot.className = 'dot';
    var size = 5 + Math.random() * 9;
    dot.style.width = dot.style.height = size + 'px';
    dot.style.background = palette[d % palette.length];
    dot.style.left = (8 + Math.random() * 84) + 'vw';
    dot.style.top  = (10 + Math.random() * 76) + 'vh';
    dot.style.animationDelay = (Math.random() * 3.5) + 's';
    dot.style.opacity = .18 + Math.random() * .35;
    document.getElementById('s1').appendChild(dot);
  }
})();

/* ---------------- 切五块的蛋糕 ---------------- */
(function(){
  var g = document.getElementById('slices');
  var cx = 200, cy = 200, R = 178, A0 = -90, STEP = 72;
  function pt(deg){
    var a = deg * Math.PI / 180;
    return [cx + R * Math.cos(a), cy + R * Math.sin(a)];
  }
  for(var i=0;i<5;i++){
    var a1 = A0 + STEP * i, a2 = a1 + STEP;
    var p1 = pt(a1), p2 = pt(a2);
    var ns = 'http://www.w3.org/2000/svg';

    var grp = document.createElementNS(ns, 'g');
    grp.setAttribute('class', 'slice');
    grp.setAttribute('data-i', i);

    // 蛋糕胚（扇形）
    var wedge = document.createElementNS(ns, 'path');
    wedge.setAttribute('d',
      'M'+cx+' '+cy+' L'+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+
      ' A'+R+' '+R+' 0 0 1 '+p2[0].toFixed(1)+' '+p2[1].toFixed(1)+' Z');
    wedge.setAttribute('fill', COLORS[i]);
    grp.appendChild(wedge);

    // 外圈奶油边
    var rim = document.createElementNS(ns, 'path');
    rim.setAttribute('d',
      'M'+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+
      ' A'+R+' '+R+' 0 0 1 '+p2[0].toFixed(1)+' '+p2[1].toFixed(1)+
      ' A'+(R-24)+' '+(R-24)+' 0 0 0 '+p1[0].toFixed(1)+' '+p1[1].toFixed(1)
    );
    // 奶油边：用扇形相减去近似
    rim.setAttribute('d',
      'M'+cx+' '+cy+' L'+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+
      ' A'+R+' '+R+' 0 0 1 '+p2[0].toFixed(1)+' '+p2[1].toFixed(1)+' Z');
    rim.setAttribute('fill', '#FFF8EE');
    rim.setAttribute('opacity', '.92');
    rim.setAttribute('transform', 'translate(0,0)');
    grp.appendChild(rim);

    // 上面再盖一层彩色扇形（留出奶油边）
    var inner = document.createElementNS(ns, 'path');
    var q1 = [cx + (R-24) * Math.cos(a1*Math.PI/180), cy + (R-24) * Math.sin(a1*Math.PI/180)];
    var q2 = [cx + (R-24) * Math.cos(a2*Math.PI/180), cy + (R-24) * Math.sin(a2*Math.PI/180)];
    inner.setAttribute('d',
      'M'+cx+' '+cy+' L'+q1[0].toFixed(1)+' '+q1[1].toFixed(1)+
      ' A'+(R-24)+' '+(R-24)+' 0 0 1 '+q2[0].toFixed(1)+' '+q2[1].toFixed(1)+' Z');
    inner.setAttribute('fill', COLORS[i]);
    grp.appendChild(inner);

    // 分切的缝
    var line1 = document.createElementNS(ns, 'path');
    line1.setAttribute('d','M'+cx+' '+cy+' L'+p1[0].toFixed(1)+' '+p1[1].toFixed(1));
    line1.setAttribute('stroke','#FFFDF7');
    line1.setAttribute('stroke-width','3');
    line1.setAttribute('opacity','.9');
    grp.appendChild(line1);

    // 糖针
    var sc = [[0.62,0],[0.74,-14],[0.55,16],[0.8,10]];
    sc.forEach(function(s, k){
      var jitter = [ [0,0],[6,-8],[-8,6],[10,4] ][ (i+k) % 4 ];
      var ang = a1 + STEP * s[0];
      var rad = R * (0.46 + 0.12 * (k % 3));
      var x = cx + rad * Math.cos(ang*Math.PI/180) + jitter[0];
      var y = cy + rad * Math.sin(ang*Math.PI/180) + jitter[1];
      var dotc = document.createElementNS(ns, 'circle');
      dotc.setAttribute('cx', x.toFixed(1));
      dotc.setAttribute('cy', y.toFixed(1));
      dotc.setAttribute('r', k===0 ? 6 : 4);
      dotc.setAttribute('fill', ['#FFFDF7','#FF9EC4','#8ED9C4','#FFFDF7'][k]);
      dotc.setAttribute('opacity','.95');
      grp.appendChild(dotc);
    });

    // 编号
    var num = document.createElementNS(ns, 'text');
    var nAng = a1 + STEP/2, nRad = R * 0.66;
    num.setAttribute('x', (cx + nRad * Math.cos(nAng*Math.PI/180)).toFixed(1));
    num.setAttribute('y', (cy + nRad * Math.sin(nAng*Math.PI/180) + 4).toFixed(1));
    num.setAttribute('text-anchor','middle');
    num.setAttribute('class','wnum');
    num.textContent = '0' + (i+1);
    grp.appendChild(num);

    // 点击
    grp.addEventListener('click', function(){
      var idx = +this.getAttribute('data-i');
      var bis = (A0 + STEP * idx + STEP/2) * Math.PI / 180;
      var pull = 14;
      this.style.transform = 'translate(' + (Math.cos(bis)*pull).toFixed(1) + 'px,' +
                             (Math.sin(bis)*pull).toFixed(1) + 'px)';
      var self = this;
      Array.prototype.forEach.call(g.children, function(c){ if(c!==self) c.classList.add('dim'); });
      setTimeout(function(){ self.style.transform = ''; openPic(idx); }, 320);
      setTimeout(function(){
        Array.prototype.forEach.call(g.children, function(c){ c.classList.remove('dim'); });
      }, 760);
    });

    g.appendChild(grp);
  }
})();

/* ---------------- 弹层 ---------------- */
function openPic(i){
  var ph = document.getElementById('ph');
  var title = document.getElementById('phTitle');
  var label = document.getElementById('picLabel');
  var frame = ph.parentNode;
  var old = frame.querySelector('img');
  if(old) old.remove();

  // 依次尝试这些位置/格式，找到哪张就用哪张
  var n = i + 1;
  var stored = null;
  try { stored = localStorage.getItem('bday_pic_' + i); } catch(e) {}
  var list = PICS[i] ? [PICS[i]] : (stored ? [stored] : [
    'images/' + n + '.jpg', 'images/' + n + '.png', 'images/' + n + '.jpeg',
    n + '.jpg', n + '.png', n + '.jpeg', n + '.JPG', n + '.PNG', n + '.JPEG'
  ]);

  document.getElementById('picLabel').textContent = '0' + n + ' / 05';
  title.textContent = CAPS[i] || ('第 ' + n + ' 张');
  ph.style.display = 'none';
  document.getElementById('pickBtn').classList.remove('on');

  function showMissing(){
    ph.style.display = 'flex';
    title.textContent = '第 ' + n + ' 张 · 没找到图片';
    var small = ph.querySelector('small');
    if(small) small.innerHTML = '把这张照片命名成 <b>' + n + '.jpg</b><br>和 HTML 放在同一个文件夹里';
    document.getElementById('pickBtn').classList.add('on');
  }

  var k = 0;
  (function attempt(){
    if(k >= list.length){ showMissing(); return; }
    var src = list[k++];
    var probe = new Image();
    probe.onload = function(){
      if(!probe.naturalWidth){ attempt(); return; }   // 有些浏览器把"失败"也报成 onload
      var img = document.createElement('img');
      img.src = src;
      img.alt = CAPS[i] || '';
      img.onerror = function(){ if(img.parentNode) img.remove(); showMissing(); };
      frame.appendChild(img);
    };
    probe.onerror = attempt;
    probe.src = src;
  })();

  document.getElementById('pic').classList.add('on');
  CUR = i;
  setTimeout(function(){ label.textContent = '0' + n + ' / 05 · ' + (CAPS[i]||''); }, 0);
}
function closePic(){ document.getElementById('pic').classList.remove('on'); }

});

/* 自带的生日歌旋律（合成音，没有版权问题） */
var MELODY = [
  [392,1],[392,1],[440,1],[392,1],[523,1],[494,2],
  [392,1],[392,1],[440,1],[392,1],[587,1],[523,2],
  [392,1],[392,1],[784,1],[659,1],[523,1],[494,1],[440,2],
  [698,1],[698,1],[659,1],[523,1],[587,1],[523,2]
];

function synthSong(){
  var AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  audioCtx = new AC();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  var unit = 0.42, cursor = audioCtx.currentTime + 0.12;

  /* 歌词跟着旋律走 */
  var LINES = ['祝你生日快乐', '祝你生日快乐', '祝你生日快乐，亲爱的你', '祝你生日快乐'];
  var LEN = [6, 6, 7, 6], at = 0;
  LEN.forEach(function(len, i){
    lyricTimers.push(setTimeout(function(){ setLyric(LINES[i]); }, at * 1000));
    at += len * unit;
  });

  MELODY.forEach(function(n){
    var osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = n[0];
    var dur = unit * n[1];
    gain.gain.setValueAtTime(0, cursor);
    gain.gain.linearRampToValueAtTime(0.22, cursor + 0.06);
    gain.gain.exponentialRampToValueAtTime(0.001, cursor + dur * 0.95);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(cursor); osc.stop(cursor + dur);
    cursor += dur;
  });

  singing = true;
  document.getElementById('bear').classList.add('singing');
  stopTimer = setTimeout(function(){ stopSong(); }, (cursor - audioCtx.currentTime + 0.4) * 1000);
}

function playSong(){
  if(singing){ stopSong(); return; }
  var bear = document.getElementById('bear');

  /* 音频和图片一样：直接扔在文件夹里就会被找到 */
  var list = MUSIC_URL ? [MUSIC_URL] : ['birthday.mp3', 'birthday.m4a', 'birthday.wav', '录音.mp3'];

  (function attempt(k){
    if(k >= list.length){ synthSong(); return; }
    var a = new Audio();
    var settled = false;
    function next(){ if(!settled){ settled = true; try{ a.pause(); }catch(e){} attempt(k + 1); } }
    a.addEventListener('error', next, { once: true });
    a.addEventListener('ended', stopSong, { once: true });
    a.src = list[k];
    a.play().then(function(){
      if(settled) return;
      settled = true;
      audioEl = a;
      singing = true;
      bear.classList.add('singing');
      setLyric('生日快乐');
    }).catch(next);
  })(0);
}

document.getElementById('env').addEventListener('click', openLetter);
document.getElementById('bear').addEventListener('click', playSong);
document.getElementById('fwRow').addEventListener('click', function(){ go('s4'); });

/* ---------------- 第四页：星空烟花 ---------------- */
var skyReady = false, cv = null, sctx = null, sW = 0, sH = 0, dpr = 1;
var parts = [], stars = [], raf = null, nextBurst = 0, lastT = 0;
var FWCOLORS = ['#FFC24D', '#FF9EC4', '#8ED9C4', '#9FC6F5', '#C7AEF0', '#FFF3C4'];

function resizeSky(){
  if(!cv) return;
  dpr = Math.min(2, window.devicePixelRatio || 1);
  sW = window.innerWidth; sH = window.innerHeight;
  cv.width = Math.round(sW * dpr); cv.height = Math.round(sH * dpr);
  cv.style.width = sW + 'px'; cv.style.height = sH + 'px';
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function initSky(){
  if(skyReady) return;
  skyReady = true;
  cv = document.getElementById('skyCanvas');
  sctx = cv.getContext('2d');
  resizeSky();
  window.addEventListener('resize', resizeSky);
  stars = [];
  for(var i = 0; i < 110; i++){
    stars.push({
      x: Math.random() * sW,
      y: Math.random() * sH * 0.72,
      r: 0.5 + Math.random() * 1.5,
      ph: Math.random() * 6.28,
      sp: 0.6 + Math.random() * 1.4
    });
  }
}

function flash(x, y, col){
  var g = sctx.createRadialGradient(x, y, 0, x, y, 70);
  g.addColorStop(0, 'rgba(255,250,235,.55)');
  g.addColorStop(.45, 'rgba(255,240,210,.18)');
  g.addColorStop(1, 'rgba(255,240,210,0)');
  sctx.globalCompositeOperation = 'lighter';
  sctx.fillStyle = g;
  sctx.beginPath(); sctx.arc(x, y, 70, 0, 6.2832); sctx.fill();
  sctx.globalCompositeOperation = 'source-over';
}

function addBurst(x, y){
  flash(x, y);
  var col = FWCOLORS[Math.floor(Math.random() * FWCOLORS.length)];
  var col2 = FWCOLORS[Math.floor(Math.random() * FWCOLORS.length)];
  var n = 64 + Math.floor(Math.random() * 26);
  var sp = 3.4 + Math.random() * 2.8;
  for(var i = 0; i < n; i++){
    var a = (Math.PI * 2) * (i / n) + Math.random() * 0.06;
    var v = sp * (0.55 + Math.random() * 0.75);
    parts.push({
      x: x, y: y, px: x, py: y,
      vx: Math.cos(a) * v, vy: Math.sin(a) * v,
      life: 62 + Math.random() * 42, max: 62 + Math.random() * 42,
      c: (i % 3 === 0) ? col2 : col,
      r: 1.3 + Math.random() * 1.5
    });
  }
}

function frame(t){
  raf = requestAnimationFrame(frame);
  if(!sctx) return;
  sctx.clearRect(0, 0, sW, sH);

  /* 星星 */
  for(var i = 0; i < stars.length; i++){
    var st = stars[i];
    var tw = 0.35 + 0.45 * Math.abs(Math.sin(t / 900 * st.sp + st.ph));
    sctx.beginPath();
    sctx.fillStyle = 'rgba(255,248,235,' + tw.toFixed(3) + ')';
    sctx.arc(st.x, st.y, st.r, 0, 6.2832);
    sctx.fill();
  }

  /* 自动放烟花 */
  if(t > nextBurst){
    nextBurst = t + 700 + Math.random() * 800;
    addBurst(sW * (0.18 + Math.random() * 0.64), sH * (0.12 + Math.random() * 0.34));
    if(Math.random() < 0.45){
      setTimeout(function(){
        addBurst(sW * (0.15 + Math.random() * 0.7), sH * (0.1 + Math.random() * 0.3));
      }, 320);
    }
  }

  sctx.globalCompositeOperation = 'lighter';
  for(var k = parts.length - 1; k >= 0; k--){
    var p = parts[k];
    p.px = p.x; p.py = p.y;
    p.vx *= 0.988; p.vy = p.vy * 0.988 + 0.035;
    p.x += p.vx; p.y += p.vy;
    p.life--;
    if(p.life <= 0){ parts.splice(k, 1); continue; }
    var al = Math.max(0, p.life / p.max);
    sctx.strokeStyle = p.c;
    sctx.globalAlpha = al * 0.9;
    sctx.lineWidth = p.r;
    sctx.beginPath();
    sctx.moveTo(p.px, p.py);
    sctx.lineTo(p.x, p.y);
    sctx.stroke();
    sctx.globalAlpha = al * 0.12;
    sctx.beginPath();
    sctx.arc(p.x, p.y, p.r * 1.6, 0, 6.2832);
    sctx.fillStyle = p.c;
    sctx.fill();
  }
  sctx.globalAlpha = 1;
  sctx.globalCompositeOperation = 'source-over';
}

function startSky(){
  initSky();
  if(!raf) raf = requestAnimationFrame(frame);
  var b = document.getElementById('bless');
  b.classList.remove('on');
  setTimeout(function(){ b.classList.add('on'); }, 900);
}

function stopSky(){
  if(raf){ cancelAnimationFrame(raf); raf = null; }
}

/* ---------------- 场景切换 ---------------- */
function go(id){
  ['s1','s2','s3','s4'].forEach(function(k){
    document.getElementById(k).classList.toggle('on', k === id);
  });
  if(id === 's4'){ startSky(); } else { stopSky(); }
}
document.getElementById('cake').addEventListener('click', function(){ go('s2'); });
document.getElementById('fork').addEventListener('click', function(){ go('s3'); });
</script>
